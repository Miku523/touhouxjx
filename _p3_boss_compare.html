<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>P3 · Boss 战斗立绘 重做对比</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0a0810; color: #ded4e8; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { padding: 12px 16px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 3px; letter-spacing: .04em; }
  .sub { font-size: 11.5px; color: #8b8399; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 7px; }
  .lab { font-size: 11px; color: #9c93ad; letter-spacing: .16em; margin: 2px 0 4px; }
  .lab b { color: #ffcf8a; font-weight: 600; letter-spacing: .04em; }
  .cell { position: relative; height: 336px; border-radius: 7px; overflow: hidden;
          background: radial-gradient(circle at 50% 32%, #241a33, #100c18 72%); border: 1px solid #221a30; }
  .cell img { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); height: 316px; width: auto; }
  .nm { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #d9c8ef; background: rgba(0,0,0,.42); padding: 1px 5px; border-radius: 3px; }
  .note { font-size: 10.5px; color: #8e86a0; text-align: center; margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>P3 · Boss 战斗立绘重做：旧 / 新 对比</h1>
  <div class="sub">同一显示比例（内容高对齐）。重做目标：<b style="color:#ffcf8a">有动作的战斗姿势</b> + 角色气质 + 原作服装。</div>

  <div class="lab">旧 · 并腿悬浮 / 手臂微张（僵硬）</div>
  <div class="row" id="old"></div>

  <div class="lab"><b>新</b> · 战斗动作 / 表情 / 气场</div>
  <div class="row" id="new"></div>
</div>
<script>
const BOSS = [
  ['cirno', '琪露诺', '嚣张 baka · 举拳大笑 + 冰锥'],
  ['aya', '射命丸文', '高速冲刺 · 举相机 + 羽扇'],
  ['yuyuko', '西行寺幽幽子', '亡灵公主 · 展袖引蝶'],
  ['kaguya', '蓬莱山辉夜', '月之公主 · 举玉临下'],
  ['flandre', '芙兰朵露', 'EX 威压 · 指认 + 展翼'],
];
function fill(id, file, isNew) {
  const row = document.getElementById(id);
  for (const [key, name, note] of BOSS) {
    const d = document.createElement('div');
    d.innerHTML = '<div class="cell"><span class="nm">' + name + '</span>' +
      '<img src="src/art/gen/boss/' + key + file + '"></div>' +
      (isNew ? '<div class="note">' + note + '</div>' : '');
    row.appendChild(d);
  }
}
fill('old', '.prev2.png', false);
fill('new', '.png', true);
</script>
</body>
</html>
