<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>東方新紀行 · 角色预览</title>
<style>
  :root{
    --bg:#08060d;
    --panel:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.08);
    --text:#f4eef7;
    --dim:#a396b0;
    --red:#e8364f;
    --gold:#f2d24b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    background:
      radial-gradient(1100px 640px at 16% -12%, rgba(232,54,79,.17), transparent 62%),
      radial-gradient(980px 560px at 90% -4%, rgba(242,210,75,.11), transparent 58%),
      radial-gradient(1200px 820px at 50% 118%, rgba(86,44,128,.24), transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:"Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 18px 26px;
  }
  #app{width:min(1500px,100%);}
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .brand h1{
    margin:0;
    font-size:24px;
    font-weight:800;
    letter-spacing:.09em;
    line-height:1.2;
    text-shadow:0 0 24px rgba(232,54,79,.25);
  }
  .brand h1 span{
    font-size:13px;
    font-weight:600;
    color:var(--gold);
    letter-spacing:.24em;
    margin-left:12px;
    vertical-align:2px;
    opacity:.9;
  }
  .brand p{
    margin:6px 0 0;
    font-size:12.5px;
    color:var(--dim);
    letter-spacing:.04em;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.022);
    backdrop-filter:blur(6px);
  }
  .btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    color:var(--text);
    font:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    transition:.18s;
    white-space:nowrap;
  }
  .btn:hover{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.12);}
  .btn.primary{
    border-color:rgba(232,54,79,.45);
    background:linear-gradient(180deg,rgba(232,54,79,.32),rgba(232,54,79,.14));
    box-shadow:0 0 18px rgba(232,54,79,.18);
  }
  .field{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--dim);
    white-space:nowrap;
  }
  .field b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;min-width:30px;text-align:right;}
  select{
    appearance:none;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:7px;
    color:var(--text);
    font:inherit;
    font-size:12.5px;
    padding:6px 22px 6px 9px;
    cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#a396b0 50%),linear-gradient(135deg,#a396b0 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;
    background-size:4px 4px,4px 4px;
    background-repeat:no-repeat;
  }
  select option{background:#16101f;color:#f4eef7;}
  input[type=range]{
    appearance:none;
    width:92px;
    height:4px;
    border-radius:2px;
    background:linear-gradient(90deg,rgba(232,54,79,.55),rgba(242,210,75,.55));
    outline:none;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:#f7f2fa;
    border:2px solid #e8364f;
    box-shadow:0 0 10px rgba(232,54,79,.5);
  }
  .check{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap;
  }
  .check input{accent-color:#e8364f;width:14px;height:14px;}
  .stage-wrap{
    position:relative;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:rgba(10,7,16,.55);
    box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .stage-wrap::before{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 18%,transparent 82%,rgba(0,0,0,.18));
    z-index:1;
  }
  canvas{display:block;width:100%;height:auto;}
  footer{
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-top:11px;
    font-size:11.5px;
    color:var(--dim);
    letter-spacing:.02em;
  }
  footer b{color:#cfc4da;font-weight:600;}
  footer .ok{color:#7fd6a4;}
  kbd{
    font:inherit;
    font-size:10.5px;
    border:1px solid rgba(255,255,255,.16);
    border-bottom-width:2px;
    border-radius:4px;
    padding:1px 5px;
    color:#cfc4da;
    background:rgba(255,255,255,.04);
  }
  @media (max-width:900px){
    body{padding:14px 10px 18px;}
    .brand h1{font-size:19px;}
    .controls{gap:10px;padding:8px 10px;}
    input[type=range]{width:70px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>東方新紀行<span>CHARACTER PREVIEW</span></h1>
      <p>博丽灵梦 / 雾雨魔理沙 · 7 状态 × 2 角色 · Canvas2D 程序化矢量绘制</p>
    </div>
    <div class="controls">
      <button id="pauseBtn" class="btn primary">⏸ 暂停</button>
      <button id="shotBtn" class="btn" title="把当前 2×7 网格保存为 PNG">保存 PNG</button>
      <label class="field">朝向
        <select id="facingSel">
          <option value="right">朝右</option>
          <option value="left">朝左</option>
          <option value="alt">左右交替</option>
        </select>
      </label>
      <label class="check"><input id="boxChk" type="checkbox" /> 包围盒</label>
      <label class="field">缩放 <input id="zoom" type="range" min="1.4" max="2.4" step="0.05" value="2.2" /><b id="zoomVal">2.2×</b></label>
      <label class="field">跑速 <input id="speed" type="range" min="0" max="420" step="10" value="260" /><b id="speedVal">260</b></label>
    </div>
  </header>

  <div class="stage-wrap"><canvas id="stage" width="1440" height="736"></canvas></div>

  <footer>
    <div id="footLeft">路径操作数统计中…</div>
    <div>快捷键 <kbd>空格</kbd> 暂停 · <kbd>F</kbd> 翻转朝向 · <kbd>B</kbd> 包围盒 · 当前缩放 <b id="footZoom">2.2×</b></div>
  </footer>
</div>

<script>

/* ---- 由 src/art/chars.js 内联，保证 file:// 双击可用 ---- */
/**
 * 《东方新纪行》角色矢量美术 —— 博丽灵梦 / 雾雨魔理沙
 *
 * 纯 Canvas2D 路径程序化绘制：无图片、无依赖、无构建、无全局副作用。
 * 局部坐标：脚底中心为 (0,0)，向上为 -y；默认朝右，facing=-1 时整体镜像。
 * 设计：Q 版头身比约 1:2.2，总高约 100（含帽子/蝴蝶结），碰撞盒见 CHAR_BOX。
 *
 * 绘制分层（从后往前）：
 *   后发 → 后臂 → 腿 → 裙 → 上身 → 前臂 → 头（脸/眼/刘海） → 帽子/发饰 → 魔法光效 → 受击白闪
 * 所有渐变均为「左上亮 → 右下暗」，所有部件带深色描边，头发用多条贝塞尔发丝堆体积。
 * 动画全部由 t / vx / vy 参数化驱动，不用逐帧硬编码。
 */

const CHAR_INFO = {
  reimu:  { name: '博丽灵梦',   accent: '#e8364f', theme: '红白巫女' },
  marisa: { name: '雾雨魔理沙', accent: '#f2d24b', theme: '黑白魔法使' },
};

/** 视觉包围盒（碰撞/镜头用），逻辑像素 */
const CHAR_BOX = { w: 40, h: 92 };

const TAU = Math.PI * 2;

/* ============================================================
 * 调色板
 * ============================================================ */

const SKIN = {
  light: '#ffeadf', mid: '#fbd4c5', shade: '#eab0a0', deep: '#cf8478', outline: '#96575a',
};

const PAL = {
  reimu: {
    skin: SKIN,
    hair: { light: '#6d4b64', mid: '#3a2538', dark: '#221321', outline: '#0f070f', shine: '#8f6b86' },
    white: { light: '#ffffff', mid: '#f4effa', shade: '#d2c9dc', deep: '#a99fba', outline: '#5b4357' },
    red: { light: '#ff6f7b', mid: '#e12b43', dark: '#a20f28', deep: '#6b0719', glow: '#ff3648' },
    shoe: { light: '#ff8a92', mid: '#cf1f38', dark: '#7d0a1b', outline: '#430310' },
    eye: {
      sclera: '#fffaf6', irisDark: '#8b0c21', iris: '#e62b43', irisLight: '#ff8f93',
      pupil: '#36050e', lash: '#290b15', brow: '#5b2934', hl: '#ffffff',
    },
    accent: '#e8364f',
    glowPre: 'rgba(255,60,80,',
  },
  marisa: {
    skin: SKIN,
    hair: { light: '#fff3b4', mid: '#f0cb52', dark: '#bd8c1c', outline: '#5e3f0b', shine: '#fff9d2' },
    white: { light: '#fffdf7', mid: '#f2eee2', shade: '#d6cfbe', deep: '#b2a996', outline: '#5b5040' },
    black: { light: '#4e4759', mid: '#2c2736', dark: '#16121e', outline: '#09070e' },
    gold: { light: '#ffe98a', mid: '#f5c32e', dark: '#b9820d', glow: '#ffd75e' },
    red: { light: '#ff6f7b', mid: '#e12b43', dark: '#a20f28', deep: '#6b0719', glow: '#ff3648' },
    shoe: { light: '#4c3c50', mid: '#2a1e2d', dark: '#130c15', outline: '#0a050b' },
    eye: {
      sclera: '#fffaf0', irisDark: '#9a6607', iris: '#f0be2a', irisLight: '#fff2a4',
      pupil: '#4a3104', lash: '#33220a', brow: '#7a5a1c', hl: '#ffffff',
    },
    accent: '#f2d24b',
    glowPre: 'rgba(255,215,90,',
  },
};

/* ============================================================
 * 基础绘制工具
 * ============================================================ */

/** 线性渐变（左上 → 右下） */
function lg(ctx, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < stops.length; i++) {
    const s = stops[i];
    // 同时兼容 [[0,'#fff'],[1,'#000']] 与 [0,'#fff',1,'#000'] 两种写法
    if (Array.isArray(s)) g.addColorStop(s[0], s[1]);
    else { g.addColorStop(s, stops[i + 1]); i++; }
  }
  return g;
}

/** 同一条路径先填后描（描边即轮廓） */
function paint(ctx, fill, stroke, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

/** 椭圆路径 */
function ell(ctx, x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
}

/** 圆头折线：先画一圈更粗的暗色做描边，再叠主体色 */
function chain(ctx, pts, w, color, outline, ow) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (outline && ow > 0) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = w + ow;
    ctx.stroke();
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.stroke();
}

/** 五角星 */
function starShape(ctx, x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.44;
    const a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/** 四芒星光点 */
function spark(ctx, x, y, r, color, lw) {
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw || 1.2;
  ctx.stroke();
}

/** 一片锥形发丝：起点宽 w，尖端收到 (tx,ty) */
function hairStrand(ctx, pal, ax, ay, tx, ty, w, bend) {
  ctx.beginPath();
  ctx.moveTo(ax - w * 0.5, ay);
  ctx.bezierCurveTo(
    ax - w * 0.45 + bend * 0.4, ay + (ty - ay) * 0.42,
    tx - w * 0.15 + bend * 0.2, ty - 5, tx, ty
  );
  ctx.bezierCurveTo(
    tx + w * 0.18 + bend * 0.2, ty - 4.5,
    ax + w * 0.55 + bend * 0.4, ay + (ty - ay) * 0.46,
    ax + w * 0.5, ay
  );
  ctx.closePath();
  paint(ctx, lg(ctx, ax - w, ay, ax + w, ty, [
    [0, pal.hair.light], [0.48, pal.hair.mid], [1, pal.hair.dark],
  ]), pal.hair.outline, 1.4);
  ctx.beginPath();
  ctx.moveTo(ax - w * 0.16, ay + 2);
  ctx.quadraticCurveTo((ax + tx) * 0.5 + bend, (ay + ty) * 0.5, tx - 1, ty - 4);
  ctx.strokeStyle = 'rgba(255,240,255,0.20)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
}

/**
 * 蝴蝶结（结 + 双环 + 可选飘带）
 * glow 传入颜色时给整个结加轻微 shadowBlur
 */
function drawBow(ctx, x, y, s, rot, c, outline, glow, tails) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.scale(s, s);
  // 调色板容错：不同角色的色组键名不完全一致（white 没有 dark 等）
  const cL = c.light || c.mid || c.shade || '#ffffff';
  const cM = c.mid || c.light || c.shade || '#ffffff';
  const cD = c.dark || c.deep || c.shade || c.outline || '#000000';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 6.5; }

  if (tails) {
    ctx.beginPath();
    ctx.moveTo(-1.5, 1.5);
    ctx.bezierCurveTo(-4, 9, -7, 14, -10.5, 15);
    ctx.quadraticCurveTo(-12.5, 15.5, -11, 12.5);
    ctx.bezierCurveTo(-8, 9, -4, 5, -1, 2.5);
    ctx.closePath();
    paint(ctx, lg(ctx, -10, 2, -2, 14, [[0, cM], [1, cD]]), outline, 1.2);
    ctx.beginPath();
    ctx.moveTo(1.5, 1.5);
    ctx.bezierCurveTo(3, 8, 5, 12, 8.5, 13.5);
    ctx.quadraticCurveTo(10.5, 14, 9.5, 11.5);
    ctx.bezierCurveTo(6.8, 8.5, 3.6, 5, 1, 2.5);
    ctx.closePath();
    paint(ctx, lg(ctx, 1, 2, 9, 13, [[0, cM], [1, cD]]), outline, 1.2);
  }

  // 左右环
  for (let m = -1; m <= 1; m += 2) {
    ctx.beginPath();
    ctx.moveTo(m * 0.8, -1.2);
    ctx.bezierCurveTo(m * 8, -8.5, m * 16.5, -7.5, m * 15.8, 0.4);
    ctx.bezierCurveTo(m * 15.2, 6.8, m * 7.4, 7.2, m * 0.8, 2.4);
    ctx.closePath();
    paint(ctx, lg(ctx, m * 1, -6, m * 16, 6, [
      [0, cL], [0.5, cM], [1, cD],
    ]), outline, 1.3);
    ctx.beginPath();
    ctx.moveTo(m * 4, -4.2);
    ctx.quadraticCurveTo(m * 10, -6.2, m * 12.5, -1.6);
    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // 结
  ell(ctx, 0, 0.6, 3.1, 3.7, 0);
  paint(ctx, lg(ctx, -3, -3, 3, 4, [[0, cM], [1, cD]]), outline, 1.2);
  ell(ctx, -0.9, -0.8, 1.1, 1.4, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();
  ctx.restore();
}

/* ============================================================
 * 骨骼与姿态（时间/速度参数化）
 * ============================================================ */

const HIP_Y = -25.5;
const SHOULDER_Y = -43.0;
const SHOULDER_X = 9.0;

function legJoints(p, side) {
  const hipX = side * 5.0;
  const a = side > 0 ? p.legFront : p.legBack;
  const knee = side > 0 ? p.kneeFront : p.kneeBack;
  const kx = hipX + Math.sin(a) * 12.4;
  const ky = HIP_Y + Math.cos(a) * 12.4;
  const sa = a - knee;
  const ax = kx + Math.sin(sa) * 11.6;
  const ay = ky + Math.cos(sa) * 11.6;
  return [hipX, HIP_Y, kx, ky, ax, ay, sa];
}

function armJoints(p, side) {
  const sx = side * SHOULDER_X;
  const sy = SHOULDER_Y;
  const a = side > 0 ? p.armFront : p.armBack;
  const bend = side > 0 ? p.elbFront : p.elbBack;
  const ex = sx + Math.sin(a) * 7.4;
  const ey = sy + Math.cos(a) * 7.4;
  const fa = a + bend;
  const hx = ex + Math.sin(fa) * 7.4;
  const hy = ey + Math.cos(fa) * 7.4;
  return { sx, sy, ex, ey, hx, hy, a, fa };
}

/** 眨眼：大部分时间睁眼，周期性快速闭合 */
function blink(t, period) {
  const u = (t / period) % 1;
  if (u > 0.945) {
    const k = (u - 0.945) / 0.055;
    return 1 - Math.sin(k * Math.PI) * 0.94;
  }
  return 1;
}

function makePose(ch, state, t, vx, vy) {
  const sp = Math.abs(vx || 0);
  // 契约：跑步频率由 |vx| 驱动
  const ph = t * (6 + sp * 0.035);

  const p = {
    ph,
    bob: 0,
    lean: 0,
    headTilt: 0,
    legFront: 0.08, legBack: -0.08,
    kneeFront: 0.14, kneeBack: 0.18,
    armFront: 0.14, armBack: 0.06,
    elbFront: 0.18, elbBack: 0.16,
    hairSway: Math.sin(t * 1.15) * 2.4 + Math.sin(t * 0.63 + 1.2) * 1.6,
    hairLift: 0,
    skirtSway: Math.sin(t * 1.55) * 0.06,
    skirtLift: 0,
    eyeOpen: 1, brow: 0, mouth: 0,
    glow: 0, castSpin: 0, after: 0,
  };

  if (state === 'idle') {
    const b = Math.sin(t * 2.15);
    p.bob = b * 1.15;
    p.lean = 0.014 + b * 0.008;
    p.headTilt = -0.02 - b * 0.012;
    p.armFront = 0.17 + b * 0.035;
    p.armBack = 0.08 - b * 0.03;
    p.elbFront = 0.22 - b * 0.03;
    p.skirtSway = Math.sin(t * 1.7) * 0.05;
    p.eyeOpen = blink(t, 3.6);
  } else if (state === 'run') {
    const s = Math.sin(ph);
    p.lean = 0.105;
    p.headTilt = -0.035;
    p.bob = -Math.abs(Math.cos(ph)) * 1.7 + 0.5;
    p.legFront = s * 0.62;
    p.legBack = -s * 0.62;
    p.kneeFront = 0.12 + Math.max(0, -s) * 0.95;
    p.kneeBack = 0.12 + Math.max(0, s) * 0.95;
    p.armFront = -s * 0.78 + 0.10;
    p.armBack = s * 0.78 + 0.02;
    p.elbFront = 0.26 + Math.max(0, s) * 0.28;
    p.elbBack = 0.26 + Math.max(0, -s) * 0.28;
    // 头发有延迟地后飘
    p.hairSway = Math.sin(ph - 0.6) * 6.5;
    p.hairLift = 0.12;
    p.skirtSway = Math.sin(ph - 0.6) * 0.14;
    p.eyeOpen = blink(t, 4.4);
    p.brow = 0.15;
  } else if (state === 'jump') {
    p.bob = -2.0;
    p.lean = 0.01;
    p.headTilt = 0.02;
    p.legFront = 0.55; p.kneeFront = 1.15;
    p.legBack = -0.20; p.kneeBack = 1.45;
    p.armFront = 2.05; p.elbFront = 0.18;
    p.armBack = 2.30; p.elbBack = 0.10;
    p.hairLift = 0.72 + Math.max(0, -vy) / 900;
    p.hairSway = -3.0;
    p.skirtLift = 0.55;
    p.skirtSway = -0.06;
    p.mouth = 1;
    p.eyeOpen = 1;
  } else if (state === 'fall') {
    p.bob = -1.2;
    p.lean = -0.05;
    p.headTilt = -0.05;
    p.legFront = 0.46; p.kneeFront = 0.55;
    p.legBack = -0.50; p.kneeBack = 0.65;
    p.armFront = 0.92; p.elbFront = -0.18;
    p.armBack = -0.88; p.elbBack = -0.12;
    p.hairLift = 0.9 + Math.min(1.2, Math.max(0, vy) / 520);
    p.hairSway = -5.5;
    p.skirtLift = 0.9;
    p.skirtSway = -0.10;
    p.mouth = 1;
    p.eyeOpen = 1;
  } else if (state === 'dash') {
    p.bob = -1.4;
    p.lean = 0.33;
    p.headTilt = -0.06;
    p.legFront = 1.02; p.kneeFront = 0.30;
    p.legBack = -1.12; p.kneeBack = 1.00;
    p.armFront = -1.00; p.elbFront = 0.34;
    p.armBack = -0.82; p.elbBack = 0.30;
    p.hairSway = -15;
    p.hairLift = 0.22;
    p.skirtSway = -0.36;
    p.skirtLift = 0.15;
    p.eyeOpen = 0.82;
    p.brow = 0.55;
    p.mouth = 2;
    p.after = 3;
  } else if (state === 'hurt') {
    p.bob = -1.0;
    p.lean = -0.29;
    p.headTilt = -0.20;
    p.legFront = 0.34; p.kneeFront = 0.52;
    p.legBack = -0.34; p.kneeBack = 0.42;
    p.armFront = -0.55; p.elbFront = 0.55;
    p.armBack = 0.95; p.elbBack = 0.45;
    p.hairSway = 4.5;
    p.hairLift = 0.15;
    p.skirtSway = 0.12;
    p.eyeOpen = 0;
    p.brow = -0.9;
    p.mouth = 3;
  } else if (state === 'cast') {
    p.bob = -0.8;
    p.lean = -0.035;
    p.headTilt = 0.03;
    p.legFront = 0.16; p.kneeFront = 0.10;
    p.legBack = -0.16; p.kneeBack = 0.16;
    p.armFront = 1.86; p.elbFront = -0.05;
    p.armBack = 1.50; p.elbBack = -0.08;
    p.hairLift = 0.45;
    p.hairSway = -2.0;
    p.skirtLift = 0.25;
    p.skirtSway = -0.03;
    p.eyeOpen = 1;
    p.mouth = 1;
    p.glow = 1;
    p.castSpin = t * 2.7;
  }
  return p;
}

/* ============================================================
 * 腿 / 鞋
 * ============================================================ */

function drawLeg(ctx, ch, pal, p, side) {
  const j = legJoints(p, side);
  const [hipX, hipY, kx, ky, ax, ay, sa] = j;
  const back = side < 0;
  const color = ch === 'marisa'
    ? (back ? '#e2dbcb' : pal.white.light)
    : (back ? pal.skin.shade : pal.skin.mid);
  const outline = ch === 'marisa' ? '#8f8574' : pal.skin.outline;

  chain(ctx, [hipX, hipY, kx, ky, ax, ay], 5.4, color, outline, 1.7);

  // 膝盖阴影
  ctx.beginPath();
  ctx.arc(kx, ky, 1.1, 0, TAU);
  ctx.fillStyle = ch === 'marisa' ? 'rgba(120,105,80,0.30)' : 'rgba(190,120,110,0.42)';
  ctx.fill();

  // 鞋（随小腿方向轻微转动）
  ctx.save();
  ctx.translate(ax, ay - 1.8);
  ctx.rotate(sa * 0.55);

  // 鞋身
  ell(ctx, 0.9, 0.2, ch === 'marisa' ? 6.0 : 5.7, 3.2, 0);
  paint(ctx, lg(ctx, -5, -3, 5, 3, [
    [0, pal.shoe.light], [0.55, pal.shoe.mid], [1, pal.shoe.dark],
  ]), pal.shoe.outline, 1.5);

  if (ch === 'marisa') {
    // 白袜口压在黑色鞋帮上
    ell(ctx, 0.2, -2.4, 4.4, 2.0, 0);
    paint(ctx, lg(ctx, -4, -4, 4, 0, [[0, '#ffffff'], [1, '#ddd6c6']]), pal.white.outline, 1.0);
    ctx.beginPath();
    ctx.moveTo(-2.2, -2.2);
    ctx.quadraticCurveTo(0.2, -3.2, 2.8, -2.0);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  } else {
    // 白色鞋口
    ctx.beginPath();
    ctx.moveTo(-3.4, -1.6);
    ctx.quadraticCurveTo(0.6, -3.4, 4.2, -1.3);
    ctx.strokeStyle = '#fff3f6';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 白鞋带
    ctx.beginPath();
    ctx.moveTo(1.4, -2.2);
    ctx.lineTo(2.4, -0.1);
    ctx.lineTo(3.7, -0.9);
    ctx.strokeStyle = '#fff3f6';
    ctx.lineWidth = 1.0;
    ctx.stroke();
  }

  // 鞋面高光
  ctx.beginPath();
  ctx.moveTo(-3.0, -1.2);
  ctx.quadraticCurveTo(0.2, -2.6, 3.2, -1.0);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1.0;
  ctx.stroke();
  ctx.restore();
}

/* ============================================================
 * 手臂 / 袖子
 * ============================================================ */

function drawArm(ctx, ch, pal, p, side) {
  const j = armJoints(p, side);
  const { sx, sy, ex, ey, hx, hy, fa } = j;
  const back = side < 0;
  const shadeSkin = back ? pal.skin.shade : pal.skin.mid;

  if (ch === 'reimu') {
    // 裸上臂
    chain(ctx, [sx, sy, ex, ey], 5.0, shadeSkin, pal.skin.outline, 2.0);

    const ux = Math.sin(fa), uy = Math.cos(fa);
    const px = uy, py = -ux;
    // 袖型：肘部收口、手腕处展开，袖口下缘受重力下垂
    const w0 = 3.8, w1 = 6.2;
    const cuff = 0.4;
    const midX = ex + ux * 7.0, midY = ey + uy * 7.0;
    const endX = hx + ux * cuff, endY = hy + uy * cuff;

    // 白色分离式宽袖
    ctx.beginPath();
    ctx.moveTo(ex + px * w0, ey + py * w0);
    ctx.quadraticCurveTo(
      midX + px * (w0 + 2.0), midY + py * (w0 + 2.0),
      endX + px * w1, endY + py * w1
    );
    // 袖口下缘：一块垂下来的布，避免袖子像圆筒
    ctx.quadraticCurveTo(
      endX + px * w1 * 0.70, endY + py * w1 * 0.70 + 2.6,
      endX + px * w1 * 0.26, endY + py * w1 * 0.26 + 6.2
    );
    ctx.quadraticCurveTo(
      endX - px * w1 * 0.34, endY - py * w1 * 0.34 + 6.6,
      endX - px * w1, endY - py * w1
    );
    ctx.quadraticCurveTo(
      midX - px * (w0 + 2.0), midY - py * (w0 + 2.0),
      ex - px * w0, ey - py * w0
    );
    ctx.closePath();
    ctx.save();
    if (p.glow > 0) {
      ctx.shadowColor = pal.red.glow;
      ctx.shadowBlur = 8 * p.glow;
    } else {
      ctx.shadowColor = 'rgba(255,60,80,0.75)';
      ctx.shadowBlur = 2.2;
    }
    paint(ctx, back
      ? lg(ctx, ex - 8, ey - 6, hx + 8, hy + 8, [[0, '#ece5f2'], [1, '#c4bad0']])
      : lg(ctx, ex - 8, ey - 6, hx + 8, hy + 8, [[0, '#ffffff'], [0.5, '#f2edf7'], [1, '#cfc6da']]),
    back ? '#77607c' : pal.white.outline, 1.7);
    ctx.restore();

    // 袖口折线（体积）
    ctx.beginPath();
    ctx.moveTo(endX - px * w1 * 0.7, endY - py * w1 * 0.7);
    ctx.quadraticCurveTo(endX + ux * 0.9, endY + uy * 0.9, endX + px * w1 * 0.7, endY + py * w1 * 0.7);
    ctx.strokeStyle = 'rgba(120,95,140,0.28)';
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 肘部红袖带
    const bx = ex + ux * 1.6, by = ey + uy * 1.6;
    ctx.beginPath();
    ctx.moveTo(bx + px * 5.3, by + py * 5.3);
    ctx.lineTo(bx - px * 5.3, by - py * 5.3);
    ctx.strokeStyle = pal.red.deep;
    ctx.lineWidth = 4.0;
    ctx.stroke();
    ctx.strokeStyle = pal.red.light;
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 手（探出袖口）
    const handX = hx + ux * 4.2, handY = hy + uy * 4.2;
    ell(ctx, handX, handY, 2.9, 2.8, 0);
    paint(ctx, back ? pal.skin.shade : pal.skin.light, pal.skin.outline, 1.3);
    ell(ctx, handX + px * 1.9, handY + py * 1.9, 1.15, 1.0, 0);
    paint(ctx, back ? pal.skin.deep : pal.skin.mid, pal.skin.outline, 0.75);
  } else {
    // 魔理沙：泡泡短袖 + 裸前臂
    const ax0 = sx + Math.sin(j.a) * 2.2;
    const ay0 = sy + Math.cos(j.a) * 2.2;
    ctx.save();
    ctx.translate(ax0, ay0);
    ctx.rotate(j.a * 0.7);
    ell(ctx, 0, 0, 5.5, 4.8, 0);
    paint(ctx, back
      ? lg(ctx, -5, -4, 5, 4, [[0, '#eae4d6'], [1, '#cfc7b6']])
      : lg(ctx, -5, -4, 5, 4, [[0, '#ffffff'], [0.55, '#f6f2e7'], [1, '#dcd5c5']]),
    back ? '#7f7561' : pal.white.outline, 1.6);
    ctx.restore();

    chain(ctx, [ax0, ay0, ex, ey, hx, hy], 4.2, shadeSkin, pal.skin.outline, 1.9);

    // 手
    const mhx = hx + Math.sin(fa) * 2.0, mhy = hy + Math.cos(fa) * 2.0;
    ell(ctx, mhx, mhy, 2.4, 2.3, 0);
    paint(ctx, back ? pal.skin.shade : pal.skin.light, pal.skin.outline, 1.3);
    ell(ctx, mhx + Math.cos(fa) * 1.5, mhy - Math.sin(fa) * 1.5, 0.95, 0.8, 0);
    paint(ctx, back ? pal.skin.deep : pal.skin.mid, pal.skin.outline, 0.7);
  }
}

  ctx.stroke();
}

function bangsMarisa(ctx, pal, p) {
  const s = p.hairSway * 0.12;

  // 侧分刘海：一大片斜扫 + 锯齿
  ctx.beginPath();
  ctx.moveTo(-22.5, -78);
  ctx.bezierCurveTo(-19.5, -88, -10, -93.2, 0.5 + s * 0.3, -93.4);
  ctx.bezierCurveTo(11, -93.6, 20.5, -87.5, 22.4, -77.6);
  ctx.lineTo(20.2, -72.0 + s * 0.1);
  ctx.quadraticCurveTo(18.2, -76.8, 16.4, -79.0);
  ctx.lineTo(13.0, -69.6);
  ctx.quadraticCurveTo(10.4, -75.6, 8.2, -80.2);
  ctx.lineTo(4.2, -70.6);
  ctx.quadraticCurveTo(1.4, -76.4, -1.6, -81.2);
  ctx.lineTo(-5.4, -71.4);
  ctx.quadraticCurveTo(-8.0, -77.0, -10.4, -80.6);
  ctx.lineTo(-14.2, -72.2);
  ctx.quadraticCurveTo(-17.2, -77.6, -19.4, -79.8);
  ctx.lineTo(-22.5, -78);
  ctx.closePath();
  paint(ctx, lg(ctx, -20, -92, 16, -70, [
    [0, pal.hair.light], [0.45, pal.hair.mid], [1, pal.hair.dark],
  ]), pal.hair.outline, 1.7);

  hairStrand(ctx, pal, -6.0, -92.5, -10.4, -71.0, 8.4, -1.4);
  hairStrand(ctx, pal, 7.0, -92.5, 11.8, -70.4, 8.0, 1.6);

  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(255,248,190,0.55)';
  ctx.beginPath();
  ctx.moveTo(-13, -88);
  ctx.quadraticCurveTo(-11.6, -80, -10.6, -74);
  ctx.moveTo(-2.4, -89.5);
  ctx.quadraticCurveTo(-2.8, -81, -2.0, -74.5);
  ctx.moveTo(9.4, -88.5);
  ctx.quadraticCurveTo(10.8, -80, 12.0, -73.5);
  ctx.stroke();
}

function sideLocksMarisa(ctx, pal, p) {
  const s = p.hairSway * 0.35;
  for (let m = -1; m <= 1; m += 2) {
    ctx.beginPath();
    ctx.moveTo(m * 22, -80);
    ctx.bezierCurveTo(m * 26.5, -72, m * 25.8, -58, m * 22.4 + s * 0.3, -47);
    ctx.bezierCurveTo(m * 21.2 + s * 0.3, -42.5, m * 19.0 + s * 0.2, -41.5, m * 17.8 + s * 0.2, -45.4);
    ctx.bezierCurveTo(m * 19.8, -57, m * 19.4, -68, m * 17.4, -78);
    ctx.closePath();
    paint(ctx, lg(ctx, m * 16, -80, m * 25, -46, [
      [0, pal.hair.mid], [0.55, pal.hair.mid], [1, pal.hair.dark],
    ]), pal.hair.outline, 1.5);
    ctx.beginPath();
    ctx.moveTo(m * 21, -76);
    ctx.quadraticCurveTo(m * 23.4, -62, m * 21.4, -48);
    ctx.strokeStyle = 'rgba(255,246,180,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
}

/* ============================================================
 * 五官
 * ============================================================ */

function facePath(ctx) {
  ctx.beginPath();
  ctx.moveTo(-20.2, -73);
  ctx.bezierCurveTo(-20.6, -82, -14, -90.5, -1, -90.8);
  ctx.bezierCurveTo(11, -91, 20.2, -84, 20.8, -74);
  ctx.bezierCurveTo(21.2, -65, 15, -56, 3, -50.2);
  ctx.bezierCurveTo(-4, -47.2, -13, -52, -17.4, -59);
  ctx.bezierCurveTo(-20, -63.5, -20.4, -68, -20.2, -73);
  ctx.closePath();
}

function drawEye(ctx, x, y, side, pal, p) {
  const e = pal.eye;
  const open = p.eyeOpen;
  const w = 8.4, h = 10.6;
  ctx.lineCap = 'round';

  if (open <= 0.22) {
    // 闭眼 / 眯成线
    ctx.beginPath();
    if (p.mouth === 3) {
      // 痛苦：外高内低的挤压线
      ctx.moveTo(x - w * 0.46, y - 0.6);
      ctx.quadraticCurveTo(x, y + 3.6, x + w * 0.46, y - 0.6);
    } else {
      ctx.moveTo(x - w * 0.46, y + 0.8);
      ctx.quadraticCurveTo(x, y - 3.2, x + w * 0.46, y + 0.8);
    }
    ctx.strokeStyle = e.lash;
    ctx.lineWidth = 2.6;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.40 * side, y - 0.2);
    ctx.lineTo(x + w * 0.68 * side, y - 2.6);
    ctx.lineWidth = 2.0;
    ctx.stroke();
    return;
  }

  const eye = () => {
    ctx.beginPath();
    ctx.moveTo(x - w * 0.48, y + h * 0.05);
    ctx.bezierCurveTo(x - w * 0.50, y - h * 0.42, x - w * 0.10, y - h * 0.55, x + w * 0.12, y - h * 0.50);
    ctx.bezierCurveTo(x + w * 0.46, y - h * 0.42, x + w * 0.50, y + h * 0.10, x + w * 0.30, y + h * 0.34);
    ctx.bezierCurveTo(x + w * 0.02, y + h * 0.56, x - w * 0.36, y + h * 0.40, x - w * 0.48, y + h * 0.05);
    ctx.closePath();
  };

  // 眼白
  eye();
  ctx.fillStyle = e.sclera;
  ctx.fill();
  eye();
  ctx.strokeStyle = e.lash;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // 虹膜（大眼睛的主体）
  const iy = y + 0.9;
  ell(ctx, x + 0.2, iy, w * 0.40, h * 0.44, 0);
  ctx.save();
  if (p.glow > 0.01) {
    ctx.shadowColor = pal.accent;
    ctx.shadowBlur = 11 * p.glow;
  }
  ctx.fillStyle = lg(ctx, x, iy - h * 0.44, x, iy + h * 0.44, [
    [0, e.irisDark], [0.5, e.iris], [1, e.irisLight],
  ]);
  ctx.fill();
  ctx.restore();

  // 瞳孔
  ell(ctx, x + 0.2, iy + 0.3, w * 0.16, h * 0.24, 0);
  ctx.fillStyle = e.pupil;
  ctx.fill();

  // 高光（大 + 小）
  ell(ctx, x - 1.5, iy - 2.5, 2.0, 2.4, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();
  ell(ctx, x + 2.0, iy + 2.6, 1.1, 1.0, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();

  // 上睫毛（粗线 + 外眼角上挑）
  ctx.beginPath();
  ctx.moveTo(x - w * 0.48, y + h * 0.02);
  ctx.bezierCurveTo(x - w * 0.50, y - h * 0.46, x - w * 0.05, y - h * 0.58, x + w * 0.18, y - h * 0.50);
  ctx.bezierCurveTo(x + w * 0.42, y - h * 0.44, x + w * 0.50, y + h * 0.02, x + w * 0.42, y + h * 0.14);
  ctx.strokeStyle = e.lash;
  ctx.lineWidth = 2.3;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + w * 0.40 * side, y - h * 0.26);
  ctx.lineTo(x + w * 0.78 * side, y - h * 0.66);
  ctx.lineWidth = 2.1;
  ctx.stroke();

  // 下眼睫（细）
  ctx.beginPath();
  ctx.moveTo(x - w * 0.26, y + h * 0.42);
  ctx.quadraticCurveTo(x + w * 0.04, y + h * 0.55, x + w * 0.30, y + h * 0.34);
  ctx.strokeStyle = 'rgba(60,20,30,0.55)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  // 施法时的高光星点
  if (p.glow > 0.4) {
    spark(ctx, x - 1.2, iy - 2.2, 2.2, `rgba(255,255,255,${0.55 + 0.35 * Math.sin(p.t || 0)})`, 1.0);
  }
}

function drawBrow(ctx, x, y, side, pal, p) {
  ctx.beginPath();
  ctx.moveTo(x + 4.6 * side, y - 8.6);
  ctx.quadraticCurveTo(x, y - 9.8 + p.brow * 0.5, x - 4.4 * side, y - 8.4 + p.brow * 1.9);
  ctx.strokeStyle = pal.eye.brow;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawMouth(ctx, pal, p, x, y) {
  ctx.lineCap = 'round';
  if (p.mouth === 1) {
    // 张嘴（跳/施法）
    ell(ctx, x, y, 2.3, 2.9, 0);
    ctx.fillStyle = '#8a3542';
    ctx.fill();
    ell(ctx, x, y + 1.4, 1.4, 1.1, 0);
    ctx.fillStyle = '#e8848e';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y, 2.3, 2.9, 0, 0, TAU);
    ctx.strokeStyle = pal.eye.lash;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  } else if (p.mouth === 2) {
    // 认真：平嘴
    ctx.beginPath();
    ctx.moveTo(x - 2.4, y);
    ctx.lineTo(x + 2.4, y);
    ctx.strokeStyle = pal.eye.lash;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else if (p.mouth === 3) {
    // 受击：波浪嘴
    ctx.beginPath();
    ctx.moveTo(x - 3.2, y + 0.4);
    ctx.quadraticCurveTo(x - 1.6, y - 2.0, x, y + 0.4);
    ctx.quadraticCurveTo(x + 1.6, y - 2.0, x + 3.2, y + 0.4);
    ctx.strokeStyle = pal.eye.lash;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else {
    // 微笑
    ctx.beginPath();
    ctx.moveTo(x - 2.6, y - 0.4);
    ctx.quadraticCurveTo(x, y + 2.4, x + 2.6, y - 0.4);
    ctx.strokeStyle = pal.eye.lash;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

/* ============================================================
 * 头部
 * ============================================================ */

function drawHead(ctx, ch, pal, p) {
  ctx.save();
  // 绕脖颈旋转
  ctx.translate(0, -46);
  ctx.rotate(p.headTilt);
  ctx.translate(0, 46);

  // 脖子
  ctx.beginPath();
  ctx.moveTo(-3.4, -51);
  ctx.lineTo(-3.2, -43);
  ctx.quadraticCurveTo(0, -40.5, 3.2, -43);
  ctx.lineTo(3.4, -51);
  ctx.closePath();
  paint(ctx, pal.skin.shade, pal.skin.outline, 1.2);

  // 发冠
  if (ch === 'reimu') hairCapReimu(ctx, pal, p);
  else hairCapMarisa(ctx, pal, p);

  // 脸
  facePath(ctx);
  paint(ctx, lg(ctx, -16, -90, 16, -52, [
    [0, pal.skin.light], [0.55, pal.skin.mid], [1, pal.skin.shade],
  ]), pal.skin.outline, 1.7);

  // 腮红
  ctx.save();
  ctx.globalAlpha *= 0.55;
  ell(ctx, -12.6, -58.4, 4.0, 2.1, -0.15);
  ctx.fillStyle = 'rgba(255,120,130,0.45)';
  ctx.fill();
  ell(ctx, 12.6, -58.8, 3.8, 2.0, 0.1);
  ctx.fillStyle = 'rgba(255,120,130,0.45)';
  ctx.fill();
  ctx.restore();

  // 眼睛 / 眉毛（左右对称，正面脸）
  drawEye(ctx, -6.9, -65.4, -1, pal, p);
  drawEye(ctx, 6.9, -65.4, 1, pal, p);
  drawBrow(ctx, -6.9, -65.4, -1, pal, p);
  drawBrow(ctx, 6.9, -65.4, 1, pal, p);

  // 鼻子
  ctx.beginPath();
  ctx.moveTo(0.4, -59.8);
  ctx.lineTo(1.6, -58.8);
  ctx.strokeStyle = 'rgba(150,80,80,0.50)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  // 嘴
  drawMouth(ctx, pal, p, 1.0, -54.6);

  // 刘海 + 侧发
  if (ch === 'reimu') bangsReimu(ctx, pal, p);
  else bangsMarisa(ctx, pal, p);
  if (ch === 'reimu') sideLocksReimu(ctx, pal, p);
  else sideLocksMarisa(ctx, pal, p);

  ctx.restore();
}

 * 服装：灵梦
 * ============================================================ */

function torsoPath(ctx) {
  ctx.beginPath();
  ctx.moveTo(-4.2, -47.5);
  ctx.bezierCurveTo(-9, -46.5, -10.6, -42, -10.2, -34);
  ctx.bezierCurveTo(-10, -30.5, -9.3, -28.5, -8.2, -27.4);
  ctx.lineTo(8.2, -27.4);
  ctx.bezierCurveTo(9.4, -28.5, 10.2, -30.5, 10.5, -34);
  ctx.bezierCurveTo(10.9, -42, 9.2, -46.5, 4.2, -47.5);
  ctx.closePath();
}

function drawReimuSkirt(ctx, pal, p) {
  ctx.save();
  const sway = p.skirtSway * 8;
  const lift = p.skirtLift;
  const hem = [];
  const n = 7;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    hem.push([
      -20 + 40 * u + sway * (0.25 + 0.75 * u),
      -13.2 + (i % 2 ? -2.6 : 0.6) - lift * 4 + Math.sin(u * Math.PI) * 1.6,
    ]);
  }

  ctx.beginPath();
  ctx.moveTo(-8.6, -29.5);
  ctx.bezierCurveTo(-11.5, -26, -17.5, -20, hem[0][0], hem[0][1]);
  for (let i = 1; i <= n; i++) {
    const a = hem[i - 1], b = hem[i];
    ctx.quadraticCurveTo((a[0] + b[0]) / 2 + (i % 2 ? 1.1 : -1.1), (a[1] + b[1]) / 2 + 1.8, b[0], b[1]);
  }
  ctx.bezierCurveTo(17.5, -20, 11.5, -26, 8.6, -29.5);
  ctx.closePath();
  paint(ctx, lg(ctx, -20, -28, 20, -12, [
    [0, pal.red.light], [0.45, pal.red.mid], [1, pal.red.dark],
  ]), pal.red.deep, 1.9);

  // 白色裙边
  ctx.beginPath();
  ctx.moveTo(hem[0][0], hem[0][1]);
  for (let i = 1; i <= n; i++) ctx.lineTo(hem[i][0], hem[i][1]);
  ctx.strokeStyle = '#fff3f6';
  ctx.lineWidth = 2.3;
  ctx.stroke();

  // 褶子
  ctx.beginPath();
  for (let i = 1; i <= 4; i++) {
    const x = -14 + i * 6.4;
    ctx.moveTo(x * 0.82, -29);
    ctx.quadraticCurveTo(x, -22, x * 1.18 + sway * 0.5, -14.5);
  }
  ctx.strokeStyle = 'rgba(120,10,32,0.42)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();
}

function drawReimuTorso(ctx, pal, p) {
  torsoPath(ctx);
  paint(ctx, lg(ctx, -10, -46, 10, -27, [
    [0, '#ffffff'], [0.55, '#f3eef8'], [1, '#cec4da'],
  ]), pal.white.outline, 1.9);

  // 侧面暗部（体积）
  ctx.beginPath();
  ctx.moveTo(6.2, -46);
  ctx.bezierCurveTo(9.4, -44, 10.4, -37, 9.8, -28.2);
  ctx.bezierCurveTo(8.0, -31, 7.4, -39, 6.2, -46);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,95,135,0.13)';
  ctx.fill();

  // 红色 V 领
  ctx.beginPath();
  ctx.moveTo(-5.4, -46.6);
  ctx.quadraticCurveTo(0, -40.0, 5.4, -46.6);
  ctx.strokeStyle = pal.red.dark;
  ctx.lineWidth = 2.8;
  ctx.stroke();
  ctx.strokeStyle = pal.red.light;
  ctx.lineWidth = 1.1;
  ctx.stroke();

  // 腰带
  ctx.beginPath();
  ctx.moveTo(-8.9, -30.6);
  ctx.quadraticCurveTo(0, -28.7, 8.9, -30.6);
  ctx.lineTo(8.6, -27.6);
  ctx.lineTo(-8.6, -27.6);
  ctx.closePath();
  paint(ctx, lg(ctx, -9, -30, 9, -27, [[0, pal.red.mid], [1, pal.red.dark]]), pal.red.deep, 1.2);

  // 胸前小蝴蝶结
  drawBow(ctx, 0.6, -40.6, 0.46, 0, pal.red, pal.red.deep, null, false);
}

function drawReimuBow(ctx, pal, p) {
  // 头顶后侧的大红蝴蝶结（轻微红光）
  drawBow(ctx, -3.0, -92.5, 1.22, -0.12, pal.red, pal.red.deep, pal.red.glow, true);

  // 额侧的小红发带结（补充细节）
  for (let m = -1; m <= 1; m += 2) {
    ctx.save();
    ctx.translate(m * 20.5, -83.2);
    ctx.rotate(m * 0.25);
    drawBow(ctx, 0, 0, 0.27, 0, pal.red, pal.red.deep, null, false);
    ctx.restore();
  }
}

/* ============================================================
 * 服装：魔理沙
 * ============================================================ */

function drawMarisaSkirt(ctx, pal, p) {
  ctx.save();
  const sway = p.skirtSway * 7;
  const lift = p.skirtLift;
  const hem = [];
  const n = 6;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    hem.push([
      -17.5 + 35 * u + sway * (0.25 + 0.75 * u),
      -12.4 + (i % 2 ? -2.2 : 0.5) - lift * 4 + Math.sin(u * Math.PI) * 1.2,
    ]);
  }

  ctx.beginPath();
  ctx.moveTo(-8.8, -29.8);
  ctx.bezierCurveTo(-11.4, -25, -16, -19, hem[0][0], hem[0][1]);
  for (let i = 1; i <= n; i++) {
    const a = hem[i - 1], b = hem[i];
    ctx.quadraticCurveTo((a[0] + b[0]) / 2 + (i % 2 ? 1.0 : -1.0), (a[1] + b[1]) / 2 + 1.6, b[0], b[1]);
  }
  ctx.bezierCurveTo(16, -19, 11.4, -25, 8.8, -29.8);
  ctx.closePath();
  paint(ctx, lg(ctx, -18, -28, 18, -11, [
    [0, pal.black.light], [0.45, pal.black.mid], [1, pal.black.dark],
  ]), pal.black.outline, 1.8);

  // 裙摆细微亮边
  ctx.beginPath();
  ctx.moveTo(hem[0][0], hem[0][1]);
  for (let i = 1; i <= n; i++) ctx.lineTo(hem[i][0], hem[i][1]);
  ctx.strokeStyle = 'rgba(150,130,180,0.30)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}

function drawMarisaTorso(ctx, pal, p) {
  // 白衬衫
  torsoPath(ctx);
  paint(ctx, lg(ctx, -10, -46, 10, -27, [
    [0, '#fffdf8'], [0.55, '#f2eee3'], [1, '#d3cbbb'],
  ]), pal.white.outline, 1.8);

  // 黑马甲左右片
  for (let m = -1; m <= 1; m += 2) {
    ctx.beginPath();
    ctx.moveTo(m * 10.4, -45.6);
    ctx.quadraticCurveTo(m * 6.4, -41.5, m * 5.0, -36);
    ctx.quadraticCurveTo(m * 4.2, -31.6, m * 5.4, -28.2);
    ctx.lineTo(m * 8.8, -27.6);
    ctx.quadraticCurveTo(m * 10.4, -34, m * 10.2, -43);
    ctx.closePath();
    paint(ctx, lg(ctx, m * 4, -46, m * 11, -27, [
      [0, pal.black.light], [0.5, pal.black.mid], [1, pal.black.dark],
    ]), pal.black.outline, 1.6);
  }

  // 马甲白色滚边
  ctx.beginPath();
  for (let m = -1; m <= 1; m += 2) {
    ctx.moveTo(m * 10.2, -45.4);
    ctx.quadraticCurveTo(m * 6.2, -41.4, m * 4.9, -36);
    ctx.quadraticCurveTo(m * 4.1, -31.6, m * 5.3, -28.4);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.72)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 金色纽扣
  ell(ctx, 7.4, -34.6, 1.15, 1.15, 0);
  paint(ctx, pal.gold.light, pal.gold.dark, 0.7);
  ell(ctx, 7.8, -30.8, 1.0, 1.0, 0);
  paint(ctx, pal.gold.light, pal.gold.dark, 0.6);

  // 白围裙腰封
  ctx.beginPath();
  ctx.moveTo(-8.9, -30.4);
  ctx.quadraticCurveTo(0, -28.8, 8.9, -30.4);
  ctx.lineTo(9.2, -28.0);
  ctx.lineTo(-9.2, -28.0);
  ctx.closePath();
  paint(ctx, lg(ctx, -9, -30, 9, -28, [[0, '#fffdf7'], [1, '#ddd5c4']]), pal.white.outline, 1.2);

  // 白围裙前片（覆盖黑裙；上缘收窄，让黑马甲在两侧露出来）
  ctx.beginPath();
  ctx.moveTo(-6.4, -29.6);
  ctx.lineTo(6.4, -29.6);
  ctx.lineTo(9.2, -17.8);
  ctx.quadraticCurveTo(6.0, -13.6, 3.0, -15.8);
  ctx.quadraticCurveTo(0, -17.2, -3.0, -15.8);
  ctx.quadraticCurveTo(-6.0, -13.6, -9.2, -17.8);
  ctx.closePath();
  paint(ctx, lg(ctx, -8, -29, 8, -14, [
    [0, '#fffdf8'], [0.6, '#f3efe4'], [1, '#d9d1c0'],
  ]), pal.white.outline, 1.4);

  // 围裙上的浅蓝灰阴影
  ctx.beginPath();
  ctx.moveTo(2.4, -29);

      ctx.lineTo(11.5, -87);

      ctx.bezierCurveTo(-27.5, -66, -27, -38, -21.5, -22);
      ctx.quadraticCurveTo(-11, -25, -7.5, -36);
      ctx.lineTo(-10, -82);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(21.5, -78);
      ctx.bezierCurveTo(27.5, -66, 27, -38, 21.5, -22);
      ctx.quadraticCurveTo(11, -25, 7.5, -36);
      ctx.lineTo(10, -82);
      ctx.closePath();

      ell(ctx, -3, -92, 11.5, 9, 0);
      ctx.fill();

    ell(ctx, 0, -70.5, 21.5, 22.5, 0);

function drawGhost(ctx, ch, pal, p, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  drawSilhouette(ctx, ch, p, pal.accent);
  ctx.restore();
}

function drawAfterimages(ctx, ch, pal, p) {
  const n = p.after | 0;
  if (n <= 0) return;

  // 速度线
  ctx.save();
  ctx.strokeStyle = pal.accent;
  ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {

    ctx.stroke();

  ctx.restore();

  for (let i = n; i >= 1; i--) {
    const k = i / (n + 1);
    ctx.save();
    ctx.translate(-i * 16, 0);
    drawGhost(ctx, ch, pal, p, 0.18 * (1 - k) + 0.04);
    ctx.restore();

function drawCastFx(ctx, pal, p) {
  if (p.glow <= 0.01) return;

  ctx.globalCompositeOperation = 'lighter';

  g.addColorStop(0, pre + '0.075)');
  g.addColorStop(0.60, pre + '0.03)');
  g.addColorStop(1, pre + '0)');

    ctx.strokeStyle = pre + (0.85 - i * 0.2) + ')';
    ctx.lineWidth = 3.0 - i * 0.7;
    ctx.stroke();

  // 环绕的光点
  for (let i = 0; i < 6; i++) {
    const ang = a * 1.15 + i * (TAU / 6);
    const rr = 36 + Math.sin(a * 2.3 + i * 1.7) * 8;

    ctx.fillStyle = pre + '0.82)';
    ctx.fill();
  }
  ctx.restore();
}

function drawFlashFx(ctx, ch, p, k) {
  const a = Math.min(1, k) * 0.48;
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha *= a;
  drawSilhouette(ctx, ch, p, '#ffffff');
  ctx.restore();
}

/* ============================================================
 * 组合
 * ============================================================ */

/** 在「以髋部为轴 + 呼吸位移 + 前倾」的坐标系里绘制上半身 */
function withTorso(ctx, p, fn) {
  ctx.save();
  ctx.translate(0, p.bob);
  ctx.translate(0, HIP_Y);
  ctx.rotate(p.lean);
  ctx.translate(0, -HIP_Y);
  fn();
  ctx.restore();
}

function drawRig(ctx, ch, pal, p) {
  // 后发（在身体后面）
  withTorso(ctx, p, () => {
    if (ch === 'reimu') backHairReimu(ctx, pal, p);
    else backHairMarisa(ctx, pal, p);
  });

  // 腿（不受呼吸影响，脚踩地）
  drawLeg(ctx, ch, pal, p, -1);
  drawLeg(ctx, ch, pal, p, 1);

  // 上半身
  withTorso(ctx, p, () => {
    drawArm(ctx, ch, pal, p, -1);       // 后臂
    if (ch === 'reimu') drawReimuSkirt(ctx, pal, p);
    else drawMarisaSkirt(ctx, pal, p);
    if (ch === 'reimu') drawReimuTorso(ctx, pal, p);
    else drawMarisaTorso(ctx, pal, p);
    drawArm(ctx, ch, pal, p, 1);        // 前臂
    drawHead(ctx, ch, pal, p);          // 头
    if (ch === 'reimu') drawReimuBow(ctx, pal, p);
    else drawHat(ctx, pal, p);
  });
}

/* ============================================================
 * 导出：绘制入口
 * ============================================================ */

/**
 * 在当前 ctx 绘制角色。调用前 ctx 已被 translate 到「角色脚底中心」，
 * 即角色站在 y=0 地面上，向上为负 y。
 *
 * @param {CanvasRenderingContext2D} ctx
 * @param {object} o
 * @param {'reimu'|'marisa'} o.char
 * @param {'idle'|'run'|'jump'|'fall'|'dash'|'hurt'|'cast'} o.state
 * @param {number} o.t 动画时钟（秒）
 * @param {number} o.facing 1=朝右, -1=朝左
 * @param {number} [o.vx=0] 水平速度 px/s
 * @param {number} [o.vy=0] 垂直速度 px/s
 * @param {number} [o.flash=0] 受击白闪 0..1
 * @param {number} [o.alpha=1] 整体透明度 0..1
 * @param {number} [o.scale=1] 整体缩放
 */
function drawCharacter(ctx, o) {
  if (!ctx || !o) return;
  const ch = o.char === 'marisa' ? 'marisa' : 'reimu';
  const state = o.state || 'idle';
  const t = o.t || 0;
  const facing = o.facing < 0 ? -1 : 1;
  const alpha = o.alpha == null ? 1 : Math.max(0, Math.min(1, o.alpha));
  const scale = o.scale == null ? 1 : o.scale;
  const vx = o.vx || 0;
  const vy = o.vy || 0;
  const flash = Math.max(0, Math.min(1, o.flash || 0));
  if (alpha <= 0.002 || scale <= 0.002) return;

  const pal = PAL[ch];
  const p = makePose(ch, state, t, vx, vy);
  p.t = t;

  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.scale(facing * scale, scale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  if (state === 'dash') drawAfterimages(ctx, ch, pal, p);

  drawRig(ctx, ch, pal, p);

  if (state === 'cast') drawCastFx(ctx, pal, p);

  if (flash > 0) drawFlashFx(ctx, ch, p, flash);

  ctx.restore();
}

          ctx.save();
          ctx.translate(cx, ground);
          ctx.scale(zoom, zoom);
          ctx.setLineDash([4 / zoom, 3 / zoom]);
          ctx.strokeStyle = rgba(accent, 0.62);
          ctx.lineWidth = 1 / zoom;
          ctx.strokeRect(-ART.CHAR_BOX.w / 2, -ART.CHAR_BOX.h, ART.CHAR_BOX.w, ART.CHAR_BOX.h);
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(-5 / zoom, 0);
          ctx.lineTo(5 / zoom, 0);
          ctx.moveTo(0, -5 / zoom);
          ctx.lineTo(0, 5 / zoom);
          ctx.strokeStyle = rgba(accent, 0.5);
          ctx.stroke();
          ctx.restore();
        }

        // 底部备注
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,.36)';
        ctx.font = '500 10.5px "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif';
        ctx.fillText(st.note, cx, rowTop + CARD_H - 12);

        // 跑速标注
        if (st.k === 'run' || st.k === 'dash') {
          ctx.fillStyle = rgba(accent, 0.6);
          ctx.font = '500 10px ui-monospace,SFMono-Regular,Consolas,monospace';
          ctx.fillText('vx ' + vx, cx, rowTop + 42);
        }
        ctx.restore();
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) t += dt;
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 交互 ---------- */
  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    pauseBtn.classList.toggle('primary', !paused);
  });

  const facingSel = document.getElementById('facingSel');
  facingSel.addEventListener('change', function () { facingMode = facingSel.value; });

  const boxChk = document.getElementById('boxChk');
  boxChk.addEventListener('change', function () { showBox = boxChk.checked; });

  const zoomEl = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const footZoom = document.getElementById('footZoom');
  zoomEl.addEventListener('input', function () {
    zoom = parseFloat(zoomEl.value);
    zoomVal.textContent = zoom.toFixed(1) + '×';
    footZoom.textContent = zoom.toFixed(1) + '×';
  });

  const speedEl = document.getElementById('speed');  const speedVal = document.getElementById('speedVal');
  speedEl.addEventListener('input', function () {
    runSpeed = parseInt(speedEl.value, 10);
    speedVal.textContent = String(runSpeed);
  });

  document.getElementById('shotBtn').addEventListener('click', function () {
    const a = document.createElement('a');
    a.download = 'chars-preview.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      pauseBtn.click();
    } else if (e.key === 'f' || e.key === 'F') {
      const opts = ['right', 'left', 'alt'];
      facingMode = opts[(opts.indexOf(facingMode) + 1) % opts.length];
      facingSel.value = facingMode;
    } else if (e.key === 'b' || e.key === 'B') {
      showBox = !showBox;
      boxChk.checked = showBox;
    }
  });

  /* ---------- 路径预算自检（用假 ctx 统计 fill/stroke 次数） ---------- */
  function measure(char, state) {
    let n = 0;
    const grad = { addColorStop: function () {} };
    const noop = function () {};
    const fake = {
      fill: function () { n++; }, stroke: function () { n++; },
      fillRect: function () { n++; }, strokeRect: function () { n++; },
      createLinearGradient: function () { return grad; },
      createRadialGradient: function () { return grad; },
      createPattern: function () { return null; },
      beginPath: noop, closePath: noop, moveTo: noop, lineTo: noop,
      bezierCurveTo: noop, quadraticCurveTo: noop, arc: noop, arcTo: noop,
      ellipse: noop, rect: noop, save: noop, restore: noop, translate: noop,
      scale: noop, rotate: noop, transform: noop, setTransform: noop,
      clip: noop, setLineDash: noop, measureText: function () { return { width: 0 }; },
      fillText: noop, strokeText: noop,
      globalAlpha: 1, globalCompositeOperation: 'source-over',
    };
    try {
      ART.drawCharacter(fake, {
        char: char, state: state, t: 1.1, facing: 1,
        vx: state === 'run' ? 260 : state === 'dash' ? 520 : 0,
      });
    } catch (err) {
      return 0;
    }
    return n;
  }

  function updateFoot() {
    const rows = [];
    let overall = 0;
    for (const c of CHARS) {
      let max = 0, maxState = '';
      for (const s of STATES) {
        const n = measure(c.k, s.k);
        if (n > max) { max = n; maxState = s.en; }
      }
      overall = Math.max(overall, max);
      rows.push(ART.CHAR_INFO[c.k].name + ' 峰值 <b>' + max + '</b>（' + maxState + '）');
    }
    document.getElementById('footLeft').innerHTML =
      '路径操作/次（含描边）：' + rows.join(' · ') +
      ' ｜ 预算 ≤ 200 ' +
      (overall <= 200 ? '<span class="ok">✓ 达标</span>' : '<span style="color:#ff7d8c">✗ 超预算</span>');
  }

  updateFoot();
  requestAnimationFrame(function (now) { last = now; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
