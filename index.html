<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover：刘海屏/挖孔屏下让画面铺满，安全区由 platform.css 用 env() 让开 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>东方新纪行 ～ Chronicle of Gensokyo</title>
  <meta name="description" content="东方新纪行 ～ Chronicle of Gensokyo：浏览器里直接开打的东方同人弹幕动作游戏，零安装。" />
  <meta name="theme-color" content="#150e1e" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <!-- PWA：装了之后离线可玩、无地址栏全屏；manifest 由平台层统一维护 -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="东方新纪行" />
  <link rel="icon" type="image/png" sizes="128x128" href="./src/art/favicon.png" />
  <link rel="apple-touch-icon" href="./src/art/apple-touch-icon.png" />
  <!-- 入口样式 / 脚本带 ?v= 缓存版本串：改动 src/ 后递增（见 README「部署」），
       旧访客的缓存会立刻失效，不必等 GitHub Pages 的 10 分钟 CDN 缓存到期 -->
  <link rel="stylesheet" href="./src/style.css?v=1.6.10" />
  <!-- 标题开屏动画：单独成文件，只读 .overlay.title-mode.intro 下的入场状态，
       不动 style.css 里既有的标题版式，方便整体回滚。 -->
  <link rel="stylesheet" href="./src/title-intro.css?v=1.6.10" />
  <!-- 触屏虚拟手柄样式：只有 body.hks-pad-on 时才生效，桌面端零影响 -->
  <link rel="stylesheet" href="./src/ui/mobile.css?v=1.6.10" />
  <link rel="stylesheet" href="./src/ui/platform.css?v=1.6.10" />
  <!-- Boss 符卡计时行 / survival 血条的追加样式：只新增 id/类，不覆盖 style.css 里既有 Boss 血条规则。
       放这里是为了让「HUD 计时」这一处改动自成一块，改完可整段删除回滚。 -->
  <style>
    /* ---------- Boss 符卡计时行（damage 倒计时 / survival 坚持时间） ---------- */
    #bossCardTimer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: calc(var(--s) * 8px);
      margin-top: calc(var(--s) * 4px);
      min-height: calc(var(--s) * 14px);
      font-family: var(--serif);
      font-size: calc(var(--s) * 11px);
      letter-spacing: .16em;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      text-shadow:
        0 1px calc(var(--s) * 2px) rgba(0, 0, 0, .95),
        0 0 calc(var(--s) * 8px) rgba(0, 0, 0, .85);
    }
    #bossCardTimer.overtime { color: #ff9a6e; }
    #bossCardTimer.survive .bct-text { color: var(--cyan); }
    #bossCardTimer .bct-mode {
      padding: calc(var(--s) * 1px) calc(var(--s) * 6px) calc(var(--s) * 1px) calc(var(--s) * 8px);
      border: 1px solid rgba(110, 231, 255, .65);
      border-radius: calc(var(--s) * 3px);
      font-size: calc(var(--s) * 9.5px);
      letter-spacing: .28em;
      color: #d9fbff;
      background: rgba(30, 150, 185, .30);
      box-shadow: 0 0 calc(var(--s) * 10px) rgba(110, 231, 255, .45);
      text-shadow: 0 0 calc(var(--s) * 8px) rgba(110, 231, 255, .8);
      animation: bct-pulse 1.1s ease-in-out infinite;
    }
    @keyframes bct-pulse {
      0%, 100% { opacity: .68; }
      50% { opacity: 1; }
    }
    /* survival 卡：Boss 免疫伤害，血条改为「剩余时间比例」并用青蓝配色区分 damage 卡 */
    #bossBar.survive .bbar { border-color: rgba(110, 231, 255, .55); }
    #bossBar.survive .bbar > i {
      background: linear-gradient(180deg, #d6fbff, #4fd6ff 42%, #0f5f8f);
      box-shadow:
        0 0 calc(var(--s) * 16px) rgba(110, 231, 255, .75),
        inset 0 1px 0 rgba(255, 255, 255, .7);
    }
  </style>
  <!-- 标题画面三张图是首屏必需素材：预加载 + 高优先级，配合启动幕保证同帧出现 -->
  <link rel="preload" as="image" href="./src/art/gen/title_bg.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="./src/art/gen/reimu_title.png" fetchpriority="high" />
  <link rel="preload" as="image" href="./src/art/gen/marisa_title.png" fetchpriority="high" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="ui">
      <!-- ===== 战斗 HUD ===== -->
      <div id="hud" class="hidden">
        <div class="hud-row">
          <div class="hud-left">
            <div id="lives" class="lives" data-char="reimu"></div>
          </div>

          <div class="hud-mid">
            <div class="power-head">
              <span class="pl">POWER</span>
              <span class="plv" title="火力等级：吃 P 点提升，放符卡会下降">
                <b>Lv.</b><i id="powerLvNum">1</i>
                <span class="lpips" id="powerPips"><i></i><i></i><i></i><i></i><i></i></span>
              </span>
            </div>
            <div class="power-body">
              <div class="pbar" id="powerBar">
                <span id="powerCastMark" class="pcast" title="符卡消耗 48 POWER"></span>
                <i id="powerFill"></i>
              </div>
              <span id="powerNum" class="pn">0</span>
              <span class="pdim">/ <b id="powerMax">128</b></span>
              <span id="powerPop" class="ppop" aria-live="polite"></span>
            </div>
            <!-- 1UP 累计：拾取 POWER / 擦弹 / 符卡奖励每满 99 点恢复 1 命 -->
            <div class="extend" id="extendBox" title="累计 1UP 点数（拾取 POWER / 擦弹 / 符卡奖励），每满 99 点恢复 1 条残机（循环）">
              <span class="ex-tag">1UP</span>
              <span class="ex-bar"><i id="extendFill"></i></span>
              <b id="extendNum">0/99</b>
            </div>
          </div>

          <div class="hud-right">
            <div class="stage-info">
              <div class="stage-line">
                <span id="stageName" class="sn">STAGE 1</span>
                <span id="timer" class="tm">0:00</span>
              </div>
              <span id="stageSub" class="ss">博丽神社 · 黄昏樱花</span>
            </div>
            <button id="settingsBtn" class="hud-settings" type="button" data-i18n-title="设置 / 暂停 (Esc)" data-i18n="设置">设置</button>
          </div>
        </div>
      </div>

      <!-- ===== Boss 血条 ===== -->
      <div id="bossBar" class="hidden">
        <div class="boss-head">
          <span id="bossName"></span>
          <span id="bossPhase"></span>
        </div>
        <div class="bbar"><i id="bossFill"></i></div>
        <!-- 卡计时/模式行：只有带 limit 的符卡才显示（EXTRA 无 limit → 整行隐藏）
             damage：「限时 剩余 12.4s」，超时后「超时 · 击破 +10 点」
             survival：SURVIVE 标记 +「坚持 12.4s」 -->
        <div id="bossCardTimer" class="hidden">
          <span id="bossCardMode" class="bct-mode hidden">SURVIVE</span>
          <span id="bossCardText" class="bct-text"></span>
        </div>
      </div>

      <!-- ===== 符卡 cut-in：释放瞬间的全屏演出（白闪 → 立绘破屏 → 符卡名砸出 → 白光收束） ===== -->
      <div id="spellCutin" class="spell-cutin" aria-hidden="true">
        <div class="sc-clear"></div>
        <div class="sc-vignette"></div>
        <div class="sc-rays"></div>
        <div class="sc-speed"></div>
        <div class="sc-rings"><i></i><i></i><i></i></div>
        <div class="sc-band"></div>
        <div class="sc-portrait">
          <canvas id="scPortrait2" class="sc-ghost" width="372" height="560"></canvas>
          <canvas id="scPortrait" width="372" height="560"></canvas>
        </div>
        <div class="sc-body">
          <div class="sc-tag">SPELL CARD</div>
          <div id="scName" class="sc-name"></div>
          <div id="scSub" class="sc-sub"></div>
        </div>
        <div class="sc-burst"></div>
        <div class="sc-flash"></div>
      </div>

      <!-- ===== 关卡横幅 ===== -->
      <div id="banner" class="banner"></div>

      <!-- ===== 剧情对白 ===== -->
      <div id="dialogue" class="hidden">
        <div class="dlg-portrait left"><canvas id="portraitL" width="400" height="560"></canvas></div>
        <div class="dlg-portrait right"><canvas id="portraitR" width="400" height="560"></canvas></div>
        <div class="dlg-box">
          <div id="speaker" class="dlg-speaker"></div>
          <div id="dlgText" class="dlg-text"></div>
          <div class="dlg-next" data-i18n="▼ 空格 / 点击继续">▼ 空格 / 点击继续</div>
        </div>
      </div>

      <!-- ===== 菜单层 ===== -->
      <div id="overlay" class="overlay">
        <div class="panel">
          <div class="logo-block">
            <h1 id="title">东方新纪行</h1>
            <p id="subtitle">～ Chronicle of Gensokyo</p>
          </div>
          <div class="menu-block">
            <div id="buttons" class="buttons"></div>
            <p id="hint" class="hint"></p>
          </div>
        </div>
        <div class="title-deco" aria-hidden="true">
          <span class="title-ver">Chronicle of Gensokyo · ver 1.6.10</span>
        </div>
      </div>

      <!-- ===== 启动幕：标题插画与立绘 decode 完成前盖住整屏 =====
           进度条读的是真实里程碑（见 src/game/bootScreen.js）；JS 接管前是纯 CSS
           的扫描光带示活；品牌汉字不做外语版。 -->
      <div id="boot" aria-hidden="true">
        <div class="boot-sky">
          <i class="boot-glow"></i>
          <i class="boot-stars"></i>
          <div class="boot-petals">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="boot-center">
          <div class="boot-rule-top"></div>
          <div class="boot-logo" role="img" aria-label="東方新紀行">
            <span class="bl-ch">東</span>
            <span class="bl-ch">方</span>
            <span class="bl-ch">新</span>
            <span class="bl-ch">紀</span>
            <span class="bl-ch">行</span>
          </div>
          <div class="boot-sub">～ Chronicle of Gensokyo ～</div>
          <div class="boot-rule"></div>
          <div class="boot-meter">
            <span class="bm-load">LOADING</span>
            <span class="bm-track">
              <span class="bm-clip">
                <span class="bm-fill"></span>
                <span class="bm-scan"></span>
              </span>
              <span class="bm-head"></span>
            </span>
            <span class="bm-pct"><b>0</b><i>%</i></span>
          </div>
          <div class="boot-pray"><span data-i18n="少女祈祷中">少女祈祷中</span><span class="bp-dots"><i>.</i><i>.</i><i>.</i></span></div>
        </div>
        <div class="boot-frame"></div>
      </div>

      <!-- ===== 结局演出 ===== -->
      <div id="ending" class="hidden" aria-live="polite">
        <div class="ed-letterbox top"></div>
        <div class="ed-letterbox bottom"></div>
        <div class="ed-brand">
          <span class="ed-brand-mark">H</span>
          <span>东方新纪行</span>
          <i>Chronicle of Gensokyo</i>
        </div>
        <div id="edChapter" class="ed-chapter"></div>
        <button id="edSkip" class="ed-skip" type="button" title="跳到结局卡">SKIP ▸</button>

        <div id="edLines" class="ed-lines line-in">
          <div id="edSpeaker" class="ed-speaker"></div>
          <div id="edText" class="ed-text"></div>
        </div>

        <div id="edCard" class="ed-card" role="group" aria-label="结局">
          <div class="ed-card-glow"></div>
          <div class="ed-card-head">
            <span class="ed-card-rule"></span>
            <span id="edCardKind" class="ed-card-heading"></span>
            <span class="ed-card-rule"></span>
          </div>
          <div id="edCardNo" class="ed-card-no">01</div>
          <div id="edCardTitle" class="ed-card-title"></div>
          <div id="edCardTitleCn" class="ed-card-title-cn"></div>
          <div id="edCardEn" class="ed-card-en"></div>
          <div class="ed-card-meta">
            <span id="edCardChar" class="ed-card-char"></span>
            <span id="edCardQuote" class="ed-card-quote"></span>
          </div>
        </div>

        <div id="edPrompt" class="ed-prompt"></div>
      </div>

      <!-- ===== 触摸控制 ===== -->
      <div id="touch" class="touch hidden">
        <div class="tpad left-pad">
          <button data-k="left" class="tbtn">◀</button>
          <button data-k="right" class="tbtn">▶</button>
        </div>
        <div class="tpad right-pad">
          <button data-k="slow" class="tbtn small">慢</button>
          <button data-k="cast" class="tbtn small">符</button>
          <button data-k="shoot" class="tbtn small">弾</button>
          <button data-k="dash" class="tbtn small">≫</button>
          <button data-k="jump" class="tbtn">▲</button>
        </div>
      </div>
      <div class="rotate-hint" aria-hidden="true" data-i18n="↻ 建议横屏游玩 · 视野更完整">↻ 建议横屏游玩 · 视野更完整</div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=1.6.10"></script>
</body>
</html>
